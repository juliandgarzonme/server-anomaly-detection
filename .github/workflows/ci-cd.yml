name: CI/CD — Server Anomaly Detection API

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

env:
  IMAGE_NAME: server-anomaly-api
  PYTHON_VERSION: "3.11"

jobs:
  # ── JOB 1: Lint + Tests ────────────────────────────────────────────
  test:
    name: Lint & Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Configurar Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Instalar dependencias
        run: pip install -r requirements.txt flake8 pytest-cov

      - name: Lint con flake8
        run: |
          flake8 main.py scripts/train.py \
            --max-line-length=100 \
            --ignore=E501,W503,E221,E222,E241,E261,E401 \
            --statistics

      - name: Entrenar modelo de prueba
        run: |
          mkdir -p models data
          cp ${{ github.workspace }}/data/intel_dataset.csv data/ 2>/dev/null || \
          python -c "
          import pandas as pd, numpy as np
          rng = np.random.default_rng(42)
          n = 800
          df = pd.DataFrame({
              'cpu_usage':                 rng.uniform(0, 100, n),
              'memory_usage':              rng.uniform(0, 100, n),
              'network_traffic':           rng.uniform(1, 1000, n),
              'power_consumption':         rng.uniform(0, 500, n),
              'num_executed_instructions': rng.uniform(3, 9999, n),
              'execution_time':            rng.uniform(0, 100, n),
              'energy_efficiency':         rng.uniform(0.001, 0.999, n),
              'task_type':    rng.choice(['io','compute','network'], n),
              'task_priority':rng.choice(['low','medium','high'], n),
              'task_status':  rng.choice(['running','completed','waiting'], n),
              'vm_id':        [str(i) for i in range(n)],
              'timestamp':    pd.date_range('2026-01-01', periods=n, freq='1min').astype(str),
          })
          df.to_csv('data/intel_dataset.csv', index=False)
          print('Dataset sintético generado para CI')
          "
          python scripts/train.py --data data/intel_dataset.csv

      - name: Ejecutar tests con cobertura
        run: |
          pytest tests/ -v \
            --cov=main \
            --cov-report=term-missing \
            --cov-fail-under=70

  # ── JOB 2: Build Docker Image ──────────────────────────────────────
  build:
    name: Build Docker Image
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name == 'push'

    steps:
      - name: Checkout código
        uses: actions/checkout@v4
        
      - name: Instalar dependencias para dataset
        run: pip install pandas numpy

      - name: Preparar dataset para build
        run: |
          mkdir -p data
          python3 -c "
          import pandas as pd, numpy as np
          rng = np.random.default_rng(42)
          n = 800
          df = pd.DataFrame({
              'cpu_usage':                 rng.uniform(0, 100, n),
              'memory_usage':              rng.uniform(0, 100, n),
              'network_traffic':           rng.uniform(1, 1000, n),
              'power_consumption':         rng.uniform(0, 500, n),
              'num_executed_instructions': rng.uniform(3, 9999, n),
              'execution_time':            rng.uniform(0, 100, n),
              'energy_efficiency':         rng.uniform(0.001, 0.999, n),
              'task_type':    rng.choice(['io','compute','network'], n),
              'task_priority':rng.choice(['low','medium','high'], n),
              'task_status':  rng.choice(['running','completed','waiting'], n),
              'vm_id':        [str(i) for i in range(n)],
              'timestamp':    pd.date_range('2026-01-01', periods=n, freq='1min').astype(str),
          })
          df.to_csv('data/intel_dataset.csv', index=False)
          "

      - name: Configurar Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login a Docker Hub
        if: github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build imagen Docker
        uses: docker/build-push-action@v5
        with:
          context: .
          target: api
          push: false                    # solo build en develop
          tags: |
            ${{ env.IMAGE_NAME }}:latest
            ${{ env.IMAGE_NAME }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test de la imagen
        run: |
          docker run -d --name smoke-test \
            -p 8000:8000 \
            ${{ env.IMAGE_NAME }}:latest
          sleep 15
          curl -f http://localhost:8000/health || (docker logs smoke-test && exit 1)
          docker stop smoke-test

  # ── JOB 3: Deploy a producción (solo main) ─────────────────────────
  deploy:
    name: Deploy Producción
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    environment: production

    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Login a Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build y Push imagen final
        uses: docker/build-push-action@v5
        with:
          context: .
          target: api
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME }}:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME }}:${{ github.sha }}

      - name: Notificar despliegue exitoso
        run: |
          echo "✅ Imagen desplegada: ${{ secrets.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME }}:${{ github.sha }}"
